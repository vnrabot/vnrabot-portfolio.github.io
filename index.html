<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vincent Rabot | Portfolio</title>

    <link rel="stylesheet" href="styles.css">
</head>

<html>
<audio id="bgm" src="assets/bgm.mp3" loop></audio>
<audio id="hover-sfx" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
<audio id="click-sfx" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

<body>
    <div class="red-slash"></div>
    <div class="p5-container">
        <main class="content">
            <div class="name-card">
                <h1 class="glitch-text">VINCENT RABOT</h1>
            </div>

            <nav class="menu">
                <button class="p5-btn" onmouseenter="playHoverSfx();"
                    onClick="showPopup('about'); playClickSfx();">ABOUT ME</button>
                <button class="p5-btn" onmouseenter="playHoverSfx();"
                    onClick="showPopup('projects'); playClickSfx();">PROJECTS</button>
                <button class="p5-btn" onmouseenter="playHoverSfx();"
                    onClick="showPopup('skills'); playClickSfx();">SKILLS</button>
                <!-- <button class="p5-btn" data-bg="pulse" onClick="showPopup('contacts')">CONTACT</button> -->
            </nav>
        </main>

        <div id="popup-overlay" class="overlay" onClick="hidePopup()">
            <div class="popup-window" onClick="event.stopPropagation()">
                <div id="popup-content"></div>
                <button class="close-btn" onClick="hidePopup()">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
